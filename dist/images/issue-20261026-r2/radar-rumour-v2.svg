도</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">관영 매체 발표</text><path d="M40 359H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">한국 당국</text><text x="258" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">소문에 의문을 표했다는 보도</text><text x="714" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">당국자의 판단</text><path d="M40 420H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 447H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="478" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 스픽스 2026.10.21 기사에 소개된 보도와 반응. 소문 자체가 사실로 확인된 것은 아님.</text></svg>