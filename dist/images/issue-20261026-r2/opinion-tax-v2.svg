<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="551" viewBox="0 0 1200 551"><rect width="1200" height="551" fill="white"/><text x="40" y="35" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#686868">주간 스픽스 · 자료</text><text x="40" y="91" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#252525">칼럼이 제기한 자산 과세의 원칙</text><path d="M40 120H1160" stroke="#252525" stroke-width="2"/><text x="40" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">논점</text><text x="258" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">고재학 칼럼의 주장</text><text x="714" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">뜻을 풀면</text><path d="M40 176H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">부동산</text><text x="258" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">조세 정의를 내세운 정부 설명</text><text x="714" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">정책의 형평 기준을 묻는 출발점</text><path d="M40 237H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">주식</text><text x="258" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">양도차익에도 일관된 원칙 적용</text><text x="714" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">다른 자산의 이익도 함께 보자는 요구</text><path d="M40 298H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">설계</text><text x="258" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">손실 반영과 투자 성격을 고려</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">같은 세율을 기계적으로 요구하는 것은 아</text><text x="714" y="367" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">님</text><path d="M40 390H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="428" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">설명 책임</text><text x="258" y="428" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">예외와 지원의 근거를 공개</text><text x="714" y="428" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">왜 다르게 부담하는지 설명하자는 취지</text><path d="M40 451H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 478H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="509" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 스픽스 10월21일 칼럼. 원 필자의 논지를 정리한 표이며 현행 세율·세무 실무 안내가 아님.</text></svg>