<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="40" y="35" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#686868">주간 스픽스 · 자료</text><text x="40" y="91" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#252525">김종대가 연결한 외교 전망</text><path d="M40 120H1160" stroke="#252525" stroke-width="2"/><text x="40" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">대목</text><text x="258" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">방송의 분석·전망</text><text x="714" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">다음 논의와의 연결</text><path d="M40 176H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">중동·유가</text><text x="258" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">전쟁 확산이 물가 부담으로 이어질 가능성</text><text x="714" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">미국 국내 정치의 부담</text><path d="M40 237H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">미국 정치</text><text x="258" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">중간선거를 앞둔 행정부의 선택</text><text x="714" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">외교적 돌파구 모색</text><path d="M40 298H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">러시아</text><text x="258" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">미국과의 관계에서 지렛대를 찾는 푸틴</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">북한에 대한 영향력 활용 가능성</text><path d="M40 359H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">북미·휴전</text><text x="258" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">APEC 계기 대화와 전선 동결 시나리오</text><text x="714" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">당사자 협의와 안보 보장 논의</text><path d="M40 420H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 447H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="478" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 10월24일 김종대의 레이더 관련 스픽스 기사. 출연자의 분석과 전망이며 확정 합의·회담 일정이 아님.</text></svg>