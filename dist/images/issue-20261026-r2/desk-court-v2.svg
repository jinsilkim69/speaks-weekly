<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="40" y="35" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#686868">주간 스픽스 · 자료</text><text x="40" y="91" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#252525">김해원의 사법개혁 제안</text><path d="M40 120H1160" stroke="#252525" stroke-width="2"/><text x="40" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">주제</text><text x="258" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">방송에서 밝힌 주장</text><text x="714" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">설명</text><path d="M40 176H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">탄핵</text><text x="258" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">국회 소추권과 헌재 심판권은 별개</text><text x="714" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">소추와 최종 판단을 구분</text><path d="M40 237H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">조직법</text><text x="258" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">대법원장의 재판상 역할 조정</text><text x="714" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">사법행정과 재판의 권한을 나누자는 제안</text><path d="M40 298H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">제청 절차</text><text x="258" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">기한과 후속 절차를 구체화</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">장기 교착을 줄이려는 입법 구상</text><path d="M40 359H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">정치의 역할</text><text x="258" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">헌법의 공백을 입법으로 보완</text><text x="714" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">갈등 해결을 사법에만 맡기지 말자는 주장</text><path d="M40 420H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 447H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="478" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 10월24일 김해원 교수 인터뷰 자막·스픽스 보도. 방송에서 제시한 개편 구상이며 시행 중인 법률로 표시하지 않음.</text></svg>