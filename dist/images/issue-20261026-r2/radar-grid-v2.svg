<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="40" y="35" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#686868">주간 스픽스 · 자료</text><text x="40" y="91" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#252525">전력망 투자 추산과 선납 제안</text><path d="M40 120H1160" stroke="#252525" stroke-width="2"/><text x="40" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">구분</text><text x="258" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">113조 원</text><text x="714" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">25조 원</text><path d="M40 176H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">성격</text><text x="258" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">송·배전망 총투자 추산</text><text x="714" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">기업 전기요금 선납 제안</text><path d="M40 237H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">범위</text><text x="258" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">2038년까지 망 확충</text><text x="714" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">약 5년 치 요금의 선납 구상</text><path d="M40 298H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">쟁점</text><text x="258" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">필요한 설비와 최종 비용 분담</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">먼저 모을 재원과 상환 조건</text><path d="M40 359H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">비교 한계</text><text x="258" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">특정 기업 전용 설비만의 금액이 아님</text><text x="714" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">총투자액에서 뺄 확정 분담금이 아님</text><path d="M40 420H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 447H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="478" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 스픽스 2026.10.23 칼럼의 설명·재인용 보도. 선납 거절과 계약 조건은 당사자 자료로 별도 확인하지 못함.</text></svg>