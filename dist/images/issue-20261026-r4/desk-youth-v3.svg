<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#20252a"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b51d28"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="42" y="35" width="38" height="5" fill="#b51d28"/><text x="96" y="47" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">청년오늘연구소의 조사 방식</text><text x="42" y="105" font-family="Malgun Gothic,sans-serif" font-size="38" font-weight="700" fill="#20252a">길에서 묻고, 답한 이유까지 들었다</text><text x="42" y="200" font-family="Malgun Gothic,sans-serif" font-size="34" font-weight="700" fill="#20252a">청년하다 회원</text><path d="M270 190L398 190" fill="none" stroke="#20252a" stroke-width="3"/><path d="M398 190L383 196L383 184Z" fill="#20252a"/><text x="435" y="200" font-family="Malgun Gothic,sans-serif" font-size="34" font-weight="700" fill="#20252a">대학 캠퍼스</text><path d="M680 190L813 190" fill="none" stroke="#20252a" stroke-width="3"/><path d="M813 190L798 196L798 184Z" fill="#20252a"/><text x="850" y="200" font-family="Malgun Gothic,sans-serif" font-size="34" font-weight="700" fill="#20252a">직접 질문</text><text x="42" y="251" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">한 사람당 설문 30~50부</text><text x="435" y="251" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">전화 대신 얼굴을 맞대고</text><text x="850" y="251" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">응답에 약 8분</text><path d="M42 307L1158 307" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="410" font-family="Malgun Gothic,sans-serif" font-size="88" font-weight="700" fill="#b51d28">965</text><text x="260" y="409" font-family="Malgun Gothic,sans-serif" font-size="36" font-weight="400" fill="#20252a">명</text><text x="435" y="360" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#20252a">숫자와 함께 물은 것</text><text x="435" y="416" font-family="Malgun Gothic,sans-serif" font-size="30" font-weight="400" fill="#20252a">대통령 평가의 이유 · 일자리 · 지방</text><text x="435" y="469" font-family="Malgun Gothic,sans-serif" font-size="30" font-weight="400" fill="#20252a">긍정과 부정 사이에 ‘보통’ 선택지</text><text x="42" y="525" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#656a70">10월 12~17일 모은 응답</text><path d="M42 588L1158 588" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="625" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">자료: 박태훈·김예은의 10월 25일 스픽스 인터뷰. 응답 비율은 연구소 발표.</text></svg>