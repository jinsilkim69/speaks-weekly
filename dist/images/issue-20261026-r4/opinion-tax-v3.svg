<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#20252a"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b51d28"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="42" y="35" width="38" height="5" fill="#b51d28"/><text x="96" y="47" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">고재학 칼럼의 핵심 질문</text><text x="42" y="105" font-family="Malgun Gothic,sans-serif" font-size="38" font-weight="700" fill="#20252a">조세 정의라는 기준, 주식 앞에서도 같은가</text><text x="42" y="190" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="400" fill="#656a70">고재학이 묻는 공통 기준</text><text x="42" y="254" font-family="Malgun Gothic,sans-serif" font-size="43" font-weight="700" fill="#20252a">어디서 번 소득인가보다, 어떤 이익인가</text><path d="M42 297L1158 297" fill="none" stroke="#20252a" stroke-width="2"/><text x="42" y="363" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#b51d28">근로소득</text><text x="42" y="427" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#20252a">월급에는 과세</text><text x="42" y="478" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#656a70">형평을 이야기할 때의 기준</text><text x="425" y="363" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#b51d28">부동산 양도차익</text><text x="425" y="427" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#20252a">정부가 조세 정의를 강조</text><text x="425" y="478" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#656a70">대통령 발언의 출발점</text><text x="808" y="363" font-family="Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#b51d28">주식 양도차익</text><text x="808" y="427" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="#20252a">예외의 범위와 이유는?</text><text x="808" y="478" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#656a70">칼럼이 정부에 던진 질문</text><path d="M42 588L1158 588" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="625" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">자료: 스픽스 10월 21일 칼럼. 과세 형평에 관한 논지 정리이며 세율·납세 안내가 아님.</text></svg>