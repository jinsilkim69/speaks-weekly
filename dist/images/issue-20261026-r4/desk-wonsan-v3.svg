<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#20252a"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b51d28"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="42" y="35" width="38" height="5" fill="#b51d28"/><text x="96" y="47" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">김종대가 설명한 원산갈마의 운영 여건</text><text x="42" y="105" font-family="Malgun Gothic,sans-serif" font-size="38" font-weight="700" fill="#20252a">호텔을 지은 다음에 남는 세 가지</text><text x="42" y="179" font-family="Malgun Gothic,sans-serif" font-size="34" font-weight="700" fill="#20252a">원산갈마의 호텔·해변</text><path d="M42 210L1158 210" fill="none" stroke="#20252a" stroke-width="2"/><text x="42" y="269" font-family="Malgun Gothic,sans-serif" font-size="31" font-weight="700" fill="#b51d28">관광객</text><text x="42" y="326" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#20252a">외부에서 들어올 수 있는가</text><text x="42" y="370" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#656a70">방문과 이동의 제약</text><text x="425" y="269" font-family="Malgun Gothic,sans-serif" font-size="31" font-weight="700" fill="#b51d28">교통</text><text x="425" y="326" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#20252a">목적지까지 이어지는가</text><text x="425" y="370" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#656a70">도로·철도·항공 연결</text><text x="808" y="269" font-family="Malgun Gothic,sans-serif" font-size="31" font-weight="700" fill="#b51d28">전력</text><text x="808" y="326" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="700" fill="#20252a">시설을 계속 가동할 수 있는가</text><text x="808" y="370" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#656a70">운영에 필요한 안정적 공급</text><path d="M600 405L600 465" fill="none" stroke="#b51d28" stroke-width="3"/><path d="M600 465L594 450L606 450Z" fill="#b51d28"/><text x="192" y="520" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">김종대의 제안: 북미·남북 관계 개선과 관광 개방을 함께</text><path d="M42 588L1158 588" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="625" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">자료: 10월 25일 김종대의 레이더. 관광 개방은 출연자의 구상과 전망.</text></svg>