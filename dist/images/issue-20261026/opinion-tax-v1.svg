<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">다른 자산에도 같은 설명 책임을</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">어떤 소득인가</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">과세 대상의 범위</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">손실은 어떻게 반영하나</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">순이익을 판단할 기준</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">지원의 목적은 무엇인가</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">혜택의 대상과 필요성</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">예외는 언제 끝나나</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">종료·재검토 조건</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">편집부의 조세 형평 평가 질문. 현행 세율·세무 처리 안내가 아니다.</text></svg>