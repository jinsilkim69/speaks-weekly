<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">전투 중지 이후에도 남는 과제</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">전투를 멈추기</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">휴전의 첫 목표</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">중단을 감시하기</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">위반 여부와 대응 절차</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">안전을 보장하기</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">당사자가 수용할 장치</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">정치적으로 해결하기</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">장기 갈등과 권리의 문제</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">휴전 논의를 읽는 개념도. 실제 협상 합의나 일정이 아니다.</text></svg>