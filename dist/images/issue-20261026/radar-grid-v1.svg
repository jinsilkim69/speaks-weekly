<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">113조 원과 25조 원은 다른 질문이다</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">113조 원</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">2038년까지 전체 망 투자 추산</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">25조 원</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">기업 전기요금 선납 제안</text><text x="95" y="565" font-family="Malgun Gothic" font-size="39" fill="#17333f">총투자 추산 ≠ 자금 조달 방식</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">출처: 스픽스 2026.10.23 이슈 기사. 두 금액을 더하거나 빼지 않는다.</text></svg>