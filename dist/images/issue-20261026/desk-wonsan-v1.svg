<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">관광은 호텔 한 채로 완성되지 않는다</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">방문과 이동</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">관광객이 갈 수 있는 범위</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">전기와 운영</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">시설을 계속 가동할 조건</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">교통과 연결</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">목적지까지 도달하는 길</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">주민과 지역</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">관광의 편익이 돌아갈 곳</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">방송 논점에서 재구성한 조건도. 실제 지리·설비 실태를 실측한 지도가 아니다.</text></svg>