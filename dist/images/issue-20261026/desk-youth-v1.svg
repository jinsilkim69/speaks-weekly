<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">캠퍼스 대면 조사의 읽는 순서</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">누구에게 물었나</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">회원들이 캠퍼스에서 모집</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">어떻게 물었나</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">설문지를 통한 대면 응답</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">무엇을 골랐나</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">다섯 단계 직무 평가</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">어디까지 말할 수 있나</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">전국 청년 대표성은 별도 검토</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">자료: 스픽스 특집인터뷰의 자동 자막 및 10월25일 신문 기사.</text></svg>