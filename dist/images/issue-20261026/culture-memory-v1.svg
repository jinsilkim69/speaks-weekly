<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">추억을 남기는 방식도 선택이다</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">재현된 과거</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">방문객에게 보여 주는 장면</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">그곳의 노동</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">관광 장면 뒤에 있는 삶</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">현재의 주민</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">관광 공간을 함께 사용하는 사람</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">제작의 배경</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">지원·협찬 여부의 공개</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">스픽스 10월4일 장생포 소개를 계기로 한 문화 비평의 질문. 현장 기록이 아니다.</text></svg>