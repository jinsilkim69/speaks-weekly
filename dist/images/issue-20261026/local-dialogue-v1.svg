<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">시민 대화의 결과는 어디로 가는가</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">참여자를 모집</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">공개된 초대와 진입 기회</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">관점의 범위를 확인</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">누가 포함되고 빠졌는지</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">과정을 기록</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">동의와 이견을 함께 남기기</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">정책으로 환류</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">반영 여부와 사유를 설명</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">편집부의 숙의 설계 제안. 10월23일 행사의 실제 결과를 표시한 도표가 아니다.</text></svg>