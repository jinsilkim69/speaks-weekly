<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>편집 데스크 · 주간 스픽스</title><link rel="stylesheet" href="/css/home.css"><style>main{max-width:1000px;margin:auto;padding:30px 20px}label{display:block;margin:16px 0;font-weight:700}input,textarea,select{display:block;width:100%;padding:12px;margin-top:6px;font:inherit;border:1px solid #aab3bf;border-radius:4px}textarea{min-height:90px}#body{min-height:360px}button{padding:12px 18px;margin:8px 8px 8px 0;cursor:pointer}fieldset{border:1px solid #ccd2da;padding:20px;margin-top:24px}#notice{padding:16px;background:#edf4f4;white-space:pre-wrap}#jobs{white-space:pre-wrap}details{margin:24px 0}.actions{position:sticky;bottom:0;background:white;border-top:1px solid #ccd2da;padding:8px}button:disabled{cursor:not-allowed;opacity:.5}</style></head><body><main><a href="/">← 홈페이지</a> · <a href="/legacy-admin.html">기존 지면 미리보기</a><h1>편집 데스크</h1><p>원고 저장 → 핵심 내용과 원문 대조 → 홈페이지 출고. 원고를 수정하면 다시 검토해야 합니다.</p><p id="notice" role="status">편집 자료를 불러오는 중입니다.</p><label>불러올 원고<select id="select"><option value="">새 원고</option></select></label><form id="form"><fieldset id="fields"><legend>원고</legend><label>기사 식별자<input id="id" required pattern="[a-zA-Z0-9_-]{1,100}" placeholder="youth-20261027"></label><label>제목<input id="title" required></label><label>부제<input id="subtitle"></label><label>분야<input id="category" value="정치 · 제도"></label><label>필자<input id="author" value="주간 스픽스 편집팀"></label><label>도입문<textarea id="lead" required></textarea></label><label>본문 — 문단은 빈 줄로, 소제목은 ## 으로 구분<textarea id="body" required></textarea></label><label>출처 — 한 줄에 출처 이름 | https 주소<textarea id="sources" required></textarea></label><label>말미 출처 안내와 실제 정리 범위<textarea id="verificationNote" required></textarea></label><label>이미지 종류<select id="image-kind"><option value="photo">보도 사진</option><option value="video-still">방송 스틸</option><option value="thumbnail">원방송 썸네일</option><option value="generated-illustration">AI 생성 삽화</option><option value="diagram">설명 도표</option></select></label><label>기사에서 이 이미지가 설명하는 것<input id="purpose" required></label><details><summary>이미지 출처·제작 기록 (출고 전 필수)</summary><label>사용 근거<select id="rights-basis"><option value="original-work">자체 제작</option><option value="permission">사용 허락 확보</option><option value="license">라이선스 확인</option></select></label><label>사용 근거 설명<textarea id="rights-note" required></textarea></label><label>허락·라이선스 근거 주소<input id="rights-reference"></label><label>사진·스틸·썸네일의 원출처<input id="source-url"></label><label>촬영일·장소 또는 방송 맥락<input id="image-context"></label><label>방송 스틸 시각 (초)<input id="timestamp" type="number" min="0"></label><label>가로 픽셀<input id="image-width" type="number" min="1" required></label><label>세로 픽셀<input id="image-height" type="number" min="1" required></label><label>AI 생성 시 사용 도구<input id="generation-tool"></label><label>AI 생성 시 제작 프롬프트<textarea id="generation-prompt"></textarea></label></details><label>이미지 주소<input id="image" required></label><label>이미지 대체 설명<input id="alt" required></label><label>캡션<input id="caption" required></label><label>이미지 제작자·출처<input id="credit" required></label></fieldset><fieldset id="review-fields"><legend>출고 검토 기록</legend><p>글자 수는 품질 점수가 아닙니다. 방송의 핵심 내용·화자·맥락이 충실하게 전해지는지 원문과 대조한 내용을 남깁니다.</p><label>근거와 발언 시점<textarea id="evidence"></textarea></label><label>핵심 내용 보존과 이해를 돕는 설명<textarea id="analysis"></textarea></label><label>방송의 이견·화자·조건 보존<textarea id="counterargument"></textarea></label><label>문체와 분량<textarea id="language"></textarea></label><label>이미지의 정확성과 사용 근거<textarea id="visual"></textarea></label><label>출고 판단<textarea id="summary"></textarea></label></fieldset><div class="actions"><button id="save" type="submit">원고 저장</button><button id="review" type="button">검토 완료</button><button id="publish" type="button">홈페이지 출고</button></div></form><details><summary>수집 작업 상태</summary><div id="jobs"></div></details></main><script type="module" src="/js/editorial.js"></script></body></html>
