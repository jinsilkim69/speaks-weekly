<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="40" y="35" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#686868">주간 스픽스 · 자료</text><text x="40" y="91" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#252525">김종대가 짚은 원산 관광의 조건</text><path d="M40 120H1160" stroke="#252525" stroke-width="2"/><text x="40" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">대목</text><text x="258" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">대담에서 설명한 내용</text><text x="714" y="153" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">서로 이어지는 문제</text><path d="M40 176H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">관광객</text><text x="258" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">시설을 찾을 수요가 있어야 운영</text><text x="714" y="214" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">방문객의 접근과 이동</text><path d="M40 237H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">전력</text><text x="258" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">호텔과 시설의 가동에 필요한 공급</text><text x="714" y="275" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">운영을 계속할 기반</text><path d="M40 298H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">교통</text><text x="258" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">도로·철도·항공을 통한 연결</text><text x="714" y="336" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">목적지까지 도달하는 길</text><path d="M40 359H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#252525">개방</text><text x="258" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">군사적 긴장과 이동 제약의 관계</text><text x="714" y="397" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#252525">평화 관광지 구상과 현실 여건</text><path d="M40 420H1160" stroke="#c7c7c4" stroke-width="1"/><path d="M40 447H1160" stroke="#c7c7c4" stroke-width="1"/><text x="40" y="478" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#606060">자료: 10월25일 김종대의 레이더. 현장 이야기는 진행자가 전한 제3자 방문담이며 직접 현장 취재는 아님.</text></svg>