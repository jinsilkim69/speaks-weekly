<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#20252a"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b51d28"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="42" y="35" width="38" height="5" fill="#b51d28"/><text x="96" y="47" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">11월 선전 APEC을 앞둔 방송 전망 · 점선은 가능성</text><text x="42" y="105" font-family="Malgun Gothic,sans-serif" font-size="38" font-weight="700" fill="#20252a">유가에서 북미 대화로, 김종대가 연결한 외교</text><text x="42" y="173" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">중동 전쟁 확산</text><path d="M303 163L400 163" fill="none" stroke="#20252a" stroke-width="3"/><path d="M400 163L385 169L385 157Z" fill="#20252a"/><text x="442" y="173" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">국제 유가 상승</text><path d="M700 163L797 163" fill="none" stroke="#20252a" stroke-width="3"/><path d="M797 163L782 169L782 157Z" fill="#20252a"/><text x="837" y="173" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">미국 물가 부담</text><text x="42" y="226" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">김종대는 유가를 미국의 외교적 선택에 영향을 주는 변수로 봤다.</text><path d="M42 270L1158 270" fill="none" stroke="#d4d7da" stroke-width="2"/><circle cx="200" cy="395" r="59" fill="white" stroke="#20252a" stroke-width="2"/><text x="157" y="404" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">러시아</text><circle cx="600" cy="395" r="59" fill="white" stroke="#20252a" stroke-width="2"/><text x="557" y="404" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">미국</text><circle cx="1000" cy="395" r="59" fill="white" stroke="#20252a" stroke-width="2"/><text x="957" y="404" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">북한</text><path d="M282 365L518 365" fill="none" stroke="#b51d28" stroke-width="3" stroke-dasharray="8 7"/><path d="M518 365L503 371L503 359Z" fill="#b51d28"/><text x="287" y="331" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#b51d28">제재·우크라이나 협상</text><path d="M682 395L918 395" fill="none" stroke="#b51d28" stroke-width="3" stroke-dasharray="8 7"/><path d="M918 395L903 401L903 389Z" fill="#b51d28"/><text x="721" y="355" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#b51d28">북미 대화 가능성</text><path d="M200 464L200 527L1000 527L1000 464" fill="none" stroke="#b51d28" stroke-width="3" stroke-dasharray="8 7"/><path d="M1000 464L994 479L1006 479Z" fill="#b51d28"/><text x="300" y="565" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#b51d28">북러 협력을 바탕으로 푸틴이 김정은을 설득할 가능성</text><path d="M42 588L1158 588" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="625" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">자료: 10월 24일 김종대의 레이더 관련 스픽스 보도. 선은 발언의 논리 관계를 표시.</text></svg>