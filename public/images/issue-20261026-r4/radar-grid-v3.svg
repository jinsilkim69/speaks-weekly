<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#20252a"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b51d28"/></marker></defs><rect width="1200" height="650" fill="white"/><rect x="42" y="35" width="38" height="5" fill="#b51d28"/><text x="96" y="47" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">전력망 투자와 요금 선납</text><text x="42" y="105" font-family="Malgun Gothic,sans-serif" font-size="38" font-weight="700" fill="#20252a">113조 원과 25조 원, 서로 다른 질문</text><text x="42" y="180" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" fill="#656a70">망 확충에 필요한 총투자 추산</text><text x="42" y="286" font-family="Malgun Gothic,sans-serif" font-size="76" font-weight="700" fill="#20252a">113조 원</text><text x="42" y="345" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="400" fill="#20252a">2038년까지 송·배전망 전체</text><text x="42" y="389" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">여러 이용자가 함께 쓰는 설비 포함</text><path d="M594 158L594 448" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="648" y="180" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="400" fill="#656a70">기업에 제안했다는 자금 조달 방식</text><text x="648" y="286" font-family="Malgun Gothic,sans-serif" font-size="76" font-weight="700" fill="#b51d28">25조 원</text><text x="648" y="345" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="400" fill="#20252a">약 5년 치 전기요금 선납 구상</text><text x="648" y="389" font-family="Malgun Gothic,sans-serif" font-size="25" font-weight="400" fill="#656a70">미리 받고 이후 요금에서 차감</text><path d="M42 462L1158 462" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="515" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#20252a">투자에 얼마가 필요한가</text><text x="648" y="515" font-family="Malgun Gothic,sans-serif" font-size="29" font-weight="700" fill="#b51d28">투자금을 언제·어떻게 마련하나</text><path d="M42 588L1158 588" fill="none" stroke="#d4d7da" stroke-width="2"/><text x="42" y="625" font-family="Malgun Gothic,sans-serif" font-size="19" font-weight="400" fill="#656a70">자료: 고재학 에디터의 스픽스 10월 23일 칼럼. 선납은 칼럼이 소개한 보도의 내용.</text></svg>