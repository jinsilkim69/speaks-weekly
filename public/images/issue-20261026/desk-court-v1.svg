<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">사법개혁에서 나눠 볼 세 질문</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">사법의 독립</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">외부의 부당한 개입 방지</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">법관의 독립</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">내부의 부당한 영향도 경계</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">수장의 권한</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">역할과 견제 장치의 설계</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">입법의 한계</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">헌법과 개별 재판의 독립 존중</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">김해원 제안에 관한 신문 자료를 읽는 개념도. 확정된 개정 법률 도표가 아니다.</text></svg>