<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">재인용이 늘어도 증거는 늘지 않는다</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">최초 게시물</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">주장의 출발점</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">여러 매체의 소개</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">같은 자료를 인용할 수 있다</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">독립된 증거</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">원본·시점·출처를 확인</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">추가 검증</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">사실 여부는 별도로 판단</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">특정 전파량을 계량한 그래프가 아닌, 재인용 구조를 설명하는 개념도.</text></svg>