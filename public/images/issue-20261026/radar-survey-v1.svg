<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">공개된 세 응답 비율은 이렇게 다르다</text><rect x="75" y="245" width="150" height="90" rx="10" fill="#b65c3d"/><rect x="225" y="245" width="520" height="90" rx="10" fill="#aab8b7"/><rect x="745" y="245" width="326" height="90" rx="10" fill="#285567"/><text x="75" y="410" font-family="Malgun Gothic" font-size="36" fill="#17333f">긍정 15%</text><text x="425" y="410" font-family="Malgun Gothic" font-size="36" fill="#17333f">보통 52%</text><text x="800" y="410" font-family="Malgun Gothic" font-size="36" fill="#17333f">부정 32.6%</text><text x="75" y="510" font-family="Malgun Gothic" font-size="27" fill="#17333f">캠퍼스 대면 모집 · 연구소 발표 결과</text><text x="75" y="570" font-family="Malgun Gothic" font-size="27" fill="#17333f">선택지·표집이 다른 조사와 단순 비교 금지</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">출처: 청년오늘연구소 방송 설명. 합계 99.6%; 나머지 0.4%p 설명 미확인.</text></svg>