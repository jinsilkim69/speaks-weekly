<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">공적 기록을 읽는 네 가지 질문</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">무엇을 약속했나</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">행동과 대상을 구체화</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">언제까지인가</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">발언과 이행 시점을 구분</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">무엇을 투입하나</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">예산·담당 기관·제도</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">무엇이 달라졌나</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">후속 조치와 공개된 결과</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">연설문집 소개를 계기로 제안하는 기록 읽기법. 책의 실제 목차가 아니다.</text></svg>