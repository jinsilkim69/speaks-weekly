<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="10" fill="#f4f0e7"/><text x="70" y="80" font-family="Malgun Gothic" font-size="20" fill="#637276">SPEAKS WEEKLY / 설명 도표</text><text x="70" y="150" font-family="Malgun Gothic" font-size="40" fill="#17333f">성장과 분배를 잇는 정책의 경로</text><rect x="70" y="215" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">산업에 투자</text><text x="100" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">설비·기술·기업의 역량</text><rect x="620" y="215" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="275" font-family="Malgun Gothic" font-size="32" fill="#17333f">일할 기회</text><text x="650" y="325" font-family="Malgun Gothic" font-size="23" fill="#17333f">첫 경력·훈련·거래 확대</text><rect x="70" y="430" width="510" height="180" rx="10" fill="#e4e8ed"/><text x="100" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">생활의 안전</text><text x="100" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">주거·돌봄·재기의 기반</text><rect x="620" y="430" width="510" height="180" rx="10" fill="#dde8e4"/><text x="650" y="490" font-family="Malgun Gothic" font-size="32" fill="#17333f">지속 가능한 재원</text><text x="650" y="540" font-family="Malgun Gothic" font-size="23" fill="#17333f">경기 하강기에도 이어갈 조건</text><path d="M70 704H1130" stroke="#c7ccca"/><text x="70" y="748" font-family="Malgun Gothic" font-size="19" fill="#526368">편집부가 제안한 정책 평가 틀. 확정 사업·성과를 표시한 도표가 아니다.</text></svg>