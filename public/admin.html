<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주간호 원고 편집 · 위클리 스픽스</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/weekly-editor.css"></head><body><main class="desk"><header class="desk-top"><a href="/">← 위클리 스픽스</a><h1>주간호 원고 편집</h1><p>원고를 읽고 고친 뒤 PDF 시안으로 확인합니다. 저장한 편집본은 발행본과 따로 보관합니다.</p></header><p id="notice" role="status">원고를 불러오는 중입니다.</p><section class="desk-controls"><label>발행호·편집본<select id="edition-select"></select></label><button id="load">불러오기</button><button id="create">새 편집본 만들기</button><button id="copy-all">전체 원고 복사</button><button id="export-text">텍스트 내려받기</button><button id="export-json">편집본 백업</button><label class="import-label">백업 불러오기<input type="file" id="import-json" accept=".json,application/json"></label></section><details class="issue-settings"><summary>주간호 제목·발행인의 말</summary><label>주간호 제목<input id="issue-title"></label><label>대상 기간<input id="issue-period"></label><label>발행인의 말<textarea id="introduction" rows="7"></textarea></label></details><div class="desk-layout"><aside class="desk-sidebar"><div class="article-count"><strong id="article-count"></strong><button id="add-article">+ 기사 추가</button></div><ol id="article-list"></ol></aside><section class="manuscript"><div class="manuscript-toolbar"><strong id="review-status"></strong><button id="copy-article">이 기사 복사</button><button id="move-up">앞으로</button><button id="move-down">뒤로</button><button id="delete-article">기사 제외</button></div><form id="article-form"><label>제목<input id="article-title" required></label><div class="two-fields"><label>분야<input id="article-category"></label><label>필자<input id="article-author"></label></div><label>담당 기자<select id="writer-profile"><option value="">기존 필자 / 별도 기고</option><option value="politics">서이준 · 정치·권력 · AI 기자</option><option value="economy">윤해림 · 경제·민생 · AI 기자</option><option value="society">한지오 · 사회·노동 · AI 기자</option><option value="world">류서안 · 외교·안보 · AI 기자</option><option value="local">정다원 · 지역·교육 · AI 기자</option><option value="culture">백여운 · 문화·인물 · AI 기자</option><option value="broadcast">문지후 · 방송·대담 · AI 기자</option></select></label><label>부제<input id="article-subtitle"></label><label>핵심 도입문<textarea id="article-lead" rows="5"></textarea></label><label>본문 <small>빈 줄로 문단을 나누고 소제목 앞에는 ## 를 씁니다.</small><textarea id="article-body" rows="24"></textarea></label><p id="article-length" class="editor-length"></p><label>출처 <small>한 줄에 출처 이름 | https 주소</small><textarea id="article-sources" rows="4"></textarea></label><details><summary>사진·삽화와 캡션</summary><div id="image-fields"></div></details></form><details class="review-panel"><summary>발행 전 검토 기록</summary><p>수정한 원고는 검토 대기로 바뀝니다. PDF 시안은 검토 전에도 만들 수 있으며 ‘미발행’으로 표시됩니다.</p><label><input type="checkbox" id="review-confirm">이 편집본의 전체 원고와 출처·수치·화자·사진을 확인했습니다.</label><label>검토 내용<textarea id="review-note" rows="4" placeholder="확인한 내용과 고친 점을 적어 주세요."></textarea></label><button id="review">현재 편집본 검토 기록</button></details></section></div><div class="desk-actions"><span id="save-state">발행본 열람 중</span><button id="save">편집본 저장</button><button id="preview">PDF 시안 만들기</button><a id="proof-link" hidden target="_blank" rel="noopener">PDF 시안 열기 ↗</a></div><p id="mode-note"></p></main><script type="application/json" id="writer-roster">[{"id": "politics", "name": "서이준", "beat": "정치·권력"}, {"id": "economy", "name": "윤해림", "beat": "경제·민생"}, {"id": "society", "name": "한지오", "beat": "사회·노동"}, {"id": "world", "name": "류서안", "beat": "외교·안보"}, {"id": "local", "name": "정다원", "beat": "지역·교육"}, {"id": "culture", "name": "백여운", "beat": "문화·인물"}, {"id": "broadcast", "name": "문지후", "beat": "방송·대담"}]</script><script type="module" src="/js/weekly-editor.js"></script></body></html>
