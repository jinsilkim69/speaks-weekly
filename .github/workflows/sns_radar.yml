name: Politician SNS Radar 24/7 Monitor

concurrency:
  group: politician-sns-radar
  cancel-in-progress: false

on:
  schedule:
    # 10분 간격으로 정각을 피해 예약 (GitHub 지연 가능)
    - cron: '3-59/10 * * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # state.json 및 data/political-voices 저장을 위한 쓰기 권한

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 10대 정치인 SNS 실시간 발언 수집 & 텔레그램 발송 & 주간지 아카이빙
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node tools/sns-monitor/run.mjs

      - name: 주간지 아카이브(data/political-voices/) & 캐시 커밋 & 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/sns-monitor/state.json data/political-voices/
          git commit -m "chore: archive politician sns speeches for weekly magazine [skip ci]" || echo "변경 사항 없음"
          git push
